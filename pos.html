<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS — DENYE KWEN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background: #eef2f7; overflow: hidden; }
  .pos-layout { display: flex; height: 100vh; }

  /* ---- Bò goch: pwodwi ---- */
  .pos-left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pos-topbar {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .pos-topbar h1 { font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .pos-search { padding: 14px 18px 8px; display: flex; gap: 10px; }
  .pos-cats { padding: 4px 18px 10px; display: flex; gap: 8px; overflow-x: auto; }
  .cat-pill {
    padding: 8px 16px;
    border: 2px solid var(--border);
    background: #fff;
    border-radius: 30px;
    font-size: 13.5px; font-weight: 600;
    white-space: nowrap;
    transition: all .25s;
  }
  .cat-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .prod-grid {
    flex: 1; overflow-y: auto;
    padding: 8px 18px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .prod-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all .25s;
    border: 2px solid transparent;
    position: relative;
  }
  .prod-card:hover { transform: translateY(-4px); border-color: var(--secondary); box-shadow: var(--shadow-lg); }
  .prod-card.out { opacity: .45; cursor: not-allowed; }
  .prod-card .p-icon { font-size: 34px; margin-bottom: 6px; }
  .prod-card .p-non { font-size: 13px; font-weight: 600; min-height: 34px; display: flex; align-items: center; justify-content: center; }
  .prod-card .p-pri { color: var(--primary); font-weight: 800; font-size: 15px; margin-top: 4px; }
  .prod-card .p-stok { position: absolute; top: 8px; right: 8px; font-size: 10.5px; }

  /* ---- Bò dwat: chariot ---- */
  .pos-right {
    width: 400px; flex-shrink: 0;
    background: #fff;
    display: flex; flex-direction: column;
    box-shadow: -6px 0 20px rgba(15,23,42,.08);
  }
  .cart-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .cart-items { flex: 1; overflow-y: auto; padding: 10px 18px; }
  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item .ci-icon { font-size: 22px; }
  .cart-item .ci-info { flex: 1; min-width: 0; }
  .cart-item .ci-non { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item .ci-pri { font-size: 12px; color: var(--text-muted); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 27px; height: 27px;
    border: none; border-radius: 7px;
    background: var(--bg);
    font-weight: 700;
    transition: all .2s;
  }
  .qty-btn:hover { background: var(--primary); color: #fff; }
  .ci-total { font-weight: 700; font-size: 13.5px; min-width: 76px; text-align: right; }
  .ci-del { background: none; border: none; color: var(--danger); font-size: 14px; }
  .cart-summary { padding: 14px 18px; border-top: 2px solid var(--border); background: #f8fafc; }
  .sum-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 7px; }
  .sum-row.total { font-size: 21px; font-weight: 800; color: var(--primary); margin: 10px 0; }
  .pay-methods { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .pay-btn {
    padding: 10px 4px;
    border: 2px solid var(--border);
    background: #fff; border-radius: 10px;
    font-size: 12.5px; font-weight: 700;
    transition: all .25s;
  }
  .pay-btn.active { border-color: var(--success); background: #d1fae5; color: #065f46; }
  .btn-pay {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--success), #059669);
    color: #fff; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800;
    box-shadow: 0 8px 20px rgba(16,185,129,.35);
    transition: all .3s;
  }
  .btn-pay:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-pay:disabled { opacity: .5; cursor: not-allowed; }

  .quick-cash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .qc-btn { padding: 10px 4px; border: 2px solid var(--border); background: #fff; border-radius: 10px; font-weight: 700; font-size: 13px; transition: all .2s; }
  .qc-btn:hover { border-color: var(--primary); background: #eff6ff; }

  .monen-box { text-align: center; padding: 14px; background: #d1fae5; border-radius: 12px; margin-top: 12px; }
  .monen-box h2 { color: #065f46; font-size: 26px; }

  /* ---- Resi 80mm ---- */
  .receipt { font-family: 'Courier New', monospace; font-size: 12.5px; color: #000; max-width: 300px; margin: 0 auto; }
  .receipt .rc-center { text-align: center; }
  .receipt hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
  .receipt table { width: 100%; border-collapse: collapse; }
  .receipt td { padding: 2px 0; vertical-align: top; }
  .receipt .rc-right { text-align: right; }

  @media (max-width: 992px) {
    body { overflow: auto; }
    .pos-layout { flex-direction: column; height: auto; }
    .pos-right { width: 100%; }
    .cart-items { max-height: 300px; }
  }
</style>
</head>
<body>

<div class="pos-layout">
  <!-- ========== BÒ GOCH: PWODWI ========== -->
  <div class="pos-left">
    <div class="pos-topbar">
      <h1><i class="fa-solid fa-cash-register"></i> POS — DENYE KWEN</h1>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:13px;opacity:.85;"><i class="fa-solid fa-user"></i> <span data-user-name>—</span></span>
        <button class="btn btn-light btn-sm" onclick="window.location.href='kesye.html'"><i class="fa-solid fa-house"></i></button>
        <button class="btn btn-danger btn-sm" data-logout><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <div class="pos-search">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="form-control" placeholder="Chèche pwodwi... (F1)">
      </div>
      <button class="btn btn-secondary" onclick="openModal('barcodeModal');document.getElementById('barcodeInput').focus()">
        <i class="fa-solid fa-barcode"></i> Scan
      </button>
    </div>

    <div class="pos-cats" id="catPills">
      <button class="cat-pill active" data-cat="">Tout</button>
    </div>

    <div class="prod-grid" id="prodGrid"><div class="spinner"></div></div>
  </div>

  <!-- ========== BÒ DWAT: CHARIOT ========== -->
  <div class="pos-right">
    <div class="cart-head">
      <div class="form-group" style="margin-bottom:0;">
        <label><i class="fa-solid fa-user"></i> Kliyan</label>
        <select id="clientSelect" class="form-control">
          <option value="">Kliyan Pasaj</option>
        </select>
      </div>
    </div>

    <div class="cart-items" id="cartItems">
      <div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><p>Chariot la vid.<br>Klike sou yon pwodwi pou ajoute li.</p></div>
    </div>

    <div class="cart-summary">
      <div class="sum-row"><span>Sou-total</span><b id="sumSouTotal">0.00 HTG</b></div>
      <div class="sum-row" style="align-items:center;">
        <span>Rabè</span>
        <input type="number" id="rabeInput" class="form-control" value="0" min="0" style="width:110px;padding:6px 10px;text-align:right;">
      </div>
      <div class="sum-row total"><span>TOTAL</span><span id="sumTotal">0.00 HTG</span></div>

      <div class="pay-methods">
        <button class="pay-btn active" data-pay="kach">💵 Kach</button>
        <button class="pay-btn" data-pay="moncash">📱 MonCash</button>
        <button class="pay-btn" data-pay="natcash">📲 NatCash</button>
      </div>

      <button class="btn-pay" id="btnPay" disabled onclick="openPayModal()">
        <i class="fa-solid fa-money-bill-wave"></i> PEYE KOUNYE A (F9)
      </button>
    </div>
  </div>
</div>

<!-- ========== MODAL PEMAN ========== -->
<div class="modal-overlay" id="payModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3><i class="fa-solid fa-money-bill-wave"></i> Peman</h3>
      <button class="modal-close" onclick="closeModal('payModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div style="text-align:center;margin-bottom:16px;">
        <p style="color:var(--text-muted);font-size:13px;">Total pou peye</p>
        <h1 style="color:var(--primary);font-size:32px;" id="payTotal">0.00 HTG</h1>
      </div>
      <div class="form-group">
        <label>Kòb resevwa</label>
        <input type="number" id="cashInput" class="form-control" min="0" step="any" style="font-size:20px;text-align:center;font-weight:700;">
      </div>
      <div class="quick-cash">
        <button class="qc-btn" onclick="setCash(500)">500</button>
        <button class="qc-btn" onclick="setCash(1000)">1000</button>
        <button class="qc-btn" onclick="setCash(5000)">5000</button>
        <button class="qc-btn" onclick="setCash('egzak')">Egzak</button>
      </div>
      <div class="monen-box">
        <p style="font-size:13px;color:#065f46;">Monen pou rann</p>
        <h2 id="monenDisplay">0.00 HTG</h2>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-light" onclick="closeModal('payModal')">Anile</button>
      <button class="btn btn-success" id="btnConfirmPay" onclick="confirmSale()">
        <i class="fa-solid fa-check"></i> Konfime Vant lan
      </button>
    </div>
  </div>
</div>

<!-- ========== MODAL BARCODE ========== -->
<div class="modal-overlay" id="barcodeModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3><i class="fa-solid fa-barcode"></i> Scan Barcode</h3>
      <button class="modal-close" onclick="closeModal('barcodeModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:12px;">
        Scan kòd la ak yon lektè barcode, oswa tape li manyèlman epi peze Enter.
      </p>
      <input type="text" id="barcodeInput" class="form-control" placeholder="Ex: 7401001000011" style="text-align:center;font-size:17px;">
    </div>
  </div>
</div>

<!-- ========== MODAL RESI ========== -->
<div class="modal-overlay" id="receiptModal">
  <div class="modal modal-sm">
    <div class="modal-header no-print">
      <h3><i class="fa-solid fa-receipt"></i> Resi</h3>
      <button class="modal-close" onclick="closeReceipt()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="receipt print-area" id="receiptContent"></div>
    </div>
    <div class="modal-footer no-print">
      <button class="btn btn-light" onclick="closeReceipt()">Fèmen</button>
      <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Enprime</button>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
// ============ ETA ============
let user = null;
let products = [];
let categories = [];
let settings = {};
let cart = [];               // {id, non, icon, pri, stok, qty}
let currentCat = '';
let payMethod = 'kach';

// ============ INISYALIZASYON (Kesye SÈLMAN) ============
(async () => {
  user = await requireRole(['Kesye']);   // blòk aksè otomatik
  if (!user) return;
  initShell(user);
  await Promise.all([loadProducts(), loadClients(), loadSettings()]);
})();

async function loadProducts() {
  const [prodRes, catRes] = await Promise.all([
    api('products.php'),
    api('products.php?kategori=1')
  ]);
  if (prodRes.success) products = prodRes.data;
  if (catRes.success) {
    categories = catRes.data;
    const pills = document.getElementById('catPills');
    pills.innerHTML = `<button class="cat-pill active" data-cat="">Tout</button>` +
      categories.map(c => `<button class="cat-pill" data-cat="${c.id}">${c.icon} ${esc(c.non)}</button>`).join('');
    pills.querySelectorAll('.cat-pill').forEach(b => b.addEventListener('click', () => {
      pills.querySelectorAll('.cat-pill').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentCat = b.dataset.cat;
      renderProducts();
    }));
  }
  renderProducts();
}

async function loadClients() {
  const res = await api('clients.php');
  if (res.success) {
    document.getElementById('clientSelect').innerHTML =
      `<option value="">Kliyan Pasaj</option>` +
      res.data.map(c => `<option value="${c.id}">${esc(c.non)}</option>`).join('');
  }
}

async function loadSettings() {
  const res = await api('settings.php');
  if (res.success && res.data) settings = res.data;
}

// ============ RANN PWODWI ============
function renderProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = products.filter(p =>
    (!currentCat || p.kategori_id == currentCat) &&
    (!q || p.non.toLowerCase().includes(q) || p.kod.toLowerCase().includes(q) || (p.barcode || '').includes(q))
  );

  const grid = document.getElementById('prodGrid');
  grid.innerHTML = list.length
    ? list.map(p => {
        const out = p.stok <= 0;
        const badge = out ? 'badge-danger' : (p.stok <= p.min_stok ? 'badge-warning' : 'badge-success');
        const btxt = out ? 'Epwize' : p.stok;
        return `
          <div class="prod-card ${out ? 'out' : ''}" onclick="${out ? '' : `addToCart(${p.id})`}">
            <span class="badge ${badge} p-stok">${btxt}</span>
            <div class="p-icon">${p.icon || '📦'}</div>
            <div class="p-non">${esc(p.non)}</div>
            <div class="p-pri">${money(p.pri)}</div>
          </div>`;
      }).join('')
    : `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-box-open"></i><p>Okenn pwodwi pa jwenn.</p></div>`;
}

document.getElementById('searchInput').addEventListener('input', renderProducts);

// ============ CHARIOT ============
function addToCart(id) {
  const p = products.find(x => x.id == id);
  if (!p) return;
  const item = cart.find(x => x.id == id);
  if (item) {
    if (item.qty >= p.stok) { toast(`Stòk pa ase pou "${p.non}" (rete ${p.stok}).`, 'warning'); return; }
    item.qty++;
  } else {
    cart.push({ id: p.id, non: p.non, icon: p.icon, pri: Number(p.pri), stok: Number(p.stok), qty: 1 });
  }
  renderCart();
}

function changeQty(id, delta) {
  const item = cart.find(x => x.id == id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(x => x.id != id);
  else if (item.qty > item.stok) { item.qty = item.stok; toast('Ou rive nan limit stòk la.', 'warning'); }
  renderCart();
}

function removeItem(id) { cart = cart.filter(x => x.id != id); renderCart(); }

function cartTotals() {
  const souTotal = cart.reduce((s, i) => s + i.pri * i.qty, 0);
  const rabe = Math.min(souTotal, Math.max(0, Number(document.getElementById('rabeInput').value) || 0));
  return { souTotal, rabe, total: souTotal - rabe };
}

function renderCart() {
  const box = document.getElementById('cartItems');
  box.innerHTML = cart.length
    ? cart.map(i => `
        <div class="cart-item">
          <span class="ci-icon">${i.icon || '📦'}</span>
          <div class="ci-info">
            <div class="ci-non">${esc(i.non)}</div>
            <div class="ci-pri">${money(i.pri)} / inite</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${i.id},-1)">−</button>
            <b>${i.qty}</b>
            <button class="qty-btn" onclick="changeQty(${i.id},1)">+</button>
          </div>
          <div class="ci-total">${money(i.pri * i.qty)}</div>
          <button class="ci-del" onclick="removeItem(${i.id})"><i class="fa-solid fa-trash"></i></button>
        </div>`).join('')
    : `<div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><p>Chariot la vid.<br>Klike sou yon pwodwi pou ajoute li.</p></div>`;

  const t = cartTotals();
  document.getElementById('sumSouTotal').textContent = money(t.souTotal);
  document.getElementById('sumTotal').textContent = money(t.total);
  document.getElementById('btnPay').disabled = cart.length === 0;
}

document.getElementById('rabeInput').addEventListener('input', renderCart);

// Mwayen peman
document.querySelectorAll('.pay-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.pay-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  payMethod = b.dataset.pay;
}));

// ============ PEMAN ============
function openPayModal() {
  if (!cart.length) return;
  const t = cartTotals();
  document.getElementById('payTotal').textContent = money(t.total);
  document.getElementById('cashInput').value = '';
  document.getElementById('monenDisplay').textContent = money(0);
  openModal('payModal');
  setTimeout(() => document.getElementById('cashInput').focus(), 200);
}

function setCash(v) {
  const t = cartTotals();
  document.getElementById('cashInput').value = v === 'egzak' ? t.total : v;
  updateMonen();
}

function updateMonen() {
  const t = cartTotals();
  const cash = Number(document.getElementById('cashInput').value) || 0;
  document.getElementById('monenDisplay').textContent = money(Math.max(0, cash - t.total));
}
document.getElementById('cashInput').addEventListener('input', updateMonen);

async function confirmSale() {
  const t = cartTotals();
  const cash = Number(document.getElementById('cashInput').value) || 0;
  if (payMethod === 'kach' && cash < t.total) {
    toast('Kòb resevwa a pa ase pou total la.', 'error');
    return;
  }

  const btn = document.getElementById('btnConfirmPay');
  btnLoading(btn, true, 'Ap anrejistre...');

  const res = await api('sales.php', 'POST', {
    client_id: document.getElementById('clientSelect').value || null,
    items: cart.map(i => ({ product_id: i.id, kantite: i.qty })),
    rabe: t.rabe,
    taks: 0,
    kob_resevwa: payMethod === 'kach' ? cash : t.total,
    mwayen_peman: payMethod
  });

  btnLoading(btn, false);

  if (res.success) {
    closeModal('payModal');
    toast(res.message, 'success');
    showReceipt(res.data);
    cart = [];
    document.getElementById('rabeInput').value = 0;
    renderCart();
    loadProducts(); // refrèch stòk
  } else {
    toast(res.message, 'error');
  }
}

// ============ RESI 80mm ============
function showReceipt(sale) {
  const line = '--------------------------------';
  document.getElementById('receiptContent').innerHTML = `
    <div class="rc-center">
      <div style="font-size:17px;font-weight:800;">${esc(settings.business_name || 'DENYE KWEN')}</div>
      <div>${esc(settings.address || '')}</div>
      <div>Tel: ${esc(settings.phone || '')}</div>
      ${settings.nif ? `<div>NIF: ${esc(settings.nif)}</div>` : ''}
    </div>
    <hr>
    <div>Fakti: <b>${esc(sale.nimewo_fakti)}</b></div>
    <div>Dat: ${fmtDate(sale.dat)}</div>
    <div>Kliyan: ${esc(sale.client_non)}</div>
    <div>Kesye: ${esc(sale.user_non)}</div>
    <hr>
    <table>
      ${sale.items.map(i => `
        <tr><td colspan="2">${esc(i.product_non)}</td></tr>
        <tr>
          <td>&nbsp;&nbsp;${i.kantite} x ${Number(i.pri_inite).toFixed(2)}</td>
          <td class="rc-right">${Number(i.total).toFixed(2)}</td>
        </tr>`).join('')}
    </table>
    <hr>
    <table>
      <tr><td>Sou-total</td><td class="rc-right">${Number(sale.sou_total).toFixed(2)}</td></tr>
      ${Number(sale.rabe) > 0 ? `<tr><td>Rabè</td><td class="rc-right">-${Number(sale.rabe).toFixed(2)}</td></tr>` : ''}
      <tr><td style="font-size:15px;font-weight:800;">TOTAL</td><td class="rc-right" style="font-size:15px;font-weight:800;">${Number(sale.total).toFixed(2)} HTG</td></tr>
      <tr><td>Peman (${esc(sale.mwayen_peman)})</td><td class="rc-right">${Number(sale.kob_resevwa).toFixed(2)}</td></tr>
      <tr><td>Monen rann</td><td class="rc-right">${Number(sale.monen_rann).toFixed(2)}</td></tr>
    </table>
    <hr>
    <div class="rc-center">${esc(settings.receipt_footer || 'Mèsi pou acha ou!')}</div>
    <div class="rc-center">${line}</div>
  `;
  openModal('receiptModal');
}

function closeReceipt() { closeModal('receiptModal'); }

// ============ BARCODE ============
document.getElementById('barcodeInput').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim();
  if (!code) return;
  const p = products.find(x => x.barcode === code);
  if (p) {
    addToCart(p.id);
    toast(`"${p.non}" ajoute nan chariot la.`, 'success');
  } else {
    const res = await api('products.php?barcode=' + encodeURIComponent(code));
    if (res.success) { products.push(res.data); addToCart(res.data.id); }
    else toast(res.message, 'error');
  }
  e.target.value = '';
});

// ============ RACCOURCI KLAVYE ============
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'F2') { e.preventDefault(); openModal('barcodeModal'); document.getElementById('barcodeInput').focus(); }
  if (e.key === 'F9') { e.preventDefault(); openPayModal(); }
});
</script>
